# Compila l'installer Windows di Project Goal Manager su un runner GitHub.
# Si avvia a ogni push su main, manualmente (Actions → Run workflow) e sui tag v*.
# Risultato: artefatto "project-goal-manager-windows" con .msi, setup .exe ed eseguibile.
name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Desktop/**', '.github/workflows/build-windows.yml']
  pull_request:
    paths: ['Desktop/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: Desktop

jobs:
  test:
    name: Typecheck + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Installer Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      - run: npm ci

      - name: Build (tauri)
        run: npm run tauri build

      - name: Elenco risultati
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle | Where-Object { $_.Extension -in '.msi', '.exe' } | ForEach-Object { $_.FullName }
          Get-ChildItem src-tauri/target/release/*.exe | ForEach-Object { $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: project-goal-manager-windows
          if-no-files-found: error
          path: |
            Desktop/src-tauri/target/release/bundle/msi/*.msi
            Desktop/src-tauri/target/release/bundle/nsis/*.exe
            Desktop/src-tauri/target/release/*.exe

      - name: Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Desktop/src-tauri/target/release/bundle/msi/*.msi
            Desktop/src-tauri/target/release/bundle/nsis/*.exe
