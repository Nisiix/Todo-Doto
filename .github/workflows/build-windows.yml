# Compila gli installer Windows di Project Goal Manager su un runner GitHub,
# uno per lingua (italiano e inglese: la lingua dell'app è decisa in fase di build).
# Si avvia a ogni push su main, manualmente (Actions → Run workflow) e sui tag v*.
# Risultato: artefatti "project-goal-manager-windows-<lingua>" con .msi, setup .exe
# ed eseguibile portabile, con la lingua nel nome del file:
#   Project-Goal-Manager_<versione>_x64_<lingua>.msi
#   Project-Goal-Manager_<versione>_x64_<lingua>-setup.exe
#   Project-Goal-Manager_<versione>_x64_<lingua>-portable.exe
# La sezione download del sito cerca questi nomi nell'ultima Release.
name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Desktop/**', '.github/workflows/build-windows.yml']
  pull_request:
    paths: ['Desktop/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: Desktop

jobs:
  test:
    name: Typecheck + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Installer Windows (${{ matrix.lang }})
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [it, en]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      - run: npm ci

      - name: Build (tauri, ${{ matrix.lang }})
        run: npm run tauri:build:${{ matrix.lang }}

      - name: Nomi dei file con versione e lingua
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $base = "Project-Goal-Manager_${version}_x64_${{ matrix.lang }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1 | Copy-Item -Destination "release/$base.msi"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1 | Copy-Item -Destination "release/$base-setup.exe"
          Get-ChildItem src-tauri/target/release/*.exe | Select-Object -First 1 | Copy-Item -Destination "release/$base-portable.exe"
          Get-ChildItem release | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: project-goal-manager-windows-${{ matrix.lang }}
          if-no-files-found: error
          path: Desktop/release/*

  # Una sola Release con gli installer di entrambe le lingue (evita che i due
  # job della matrice la creino in parallelo).
  release:
    name: Release (solo sui tag v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: project-goal-manager-windows-*
          path: release
          merge-multiple: true

      - run: ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
