name: Segnala un problema · Report a problem
description: Qualcosa non funziona come dovrebbe · Something does not work as it should
title: "[Problema] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per la segnalazione. Scrivi pure in italiano o in inglese.
        Non incollare password, chiavi o dati riservati: la segnalazione è pubblica.

        Thanks for reporting. Italian or English are both fine.
        Do not paste passwords, keys or confidential data: this issue is public.
  - type: textarea
    id: what
    attributes:
      label: Cosa è successo · What happened
      description: Cosa ti aspettavi e cosa è successo invece · What you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Come riprodurlo · How to reproduce
      description: I passi, uno per riga · The steps, one per line
      placeholder: |
        1. Apro un workspace di rete
        2. …
  - type: input
    id: version
    attributes:
      label: Versione di Todo Doto · Todo Doto version
      description: La trovi in Impostazioni › Generali · You find it in Settings › General
      placeholder: "0.7.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Sistema · System
      placeholder: "Windows 11"
  - type: dropdown
    id: workspace
    attributes:
      label: Tipo di workspace · Workspace type
      options:
        - Locale (solo questo PC) · Local (this PC only)
        - Di rete (cartella condivisa) · Network (shared folder)
        - Non so · I don't know
  - type: textarea
    id: extra
    attributes:
      label: Altro · Anything else
      description: Schermate, messaggi di errore… (trascina qui le immagini) · Screenshots, error messages… (drop images here)
