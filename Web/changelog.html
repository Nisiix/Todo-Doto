<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="log.title">Novità per versione — Todo Doto</title>
  <meta name="description" content="Note di rilascio di Todo Doto: cosa cambia in ogni versione." />
  <link rel="icon" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <script>
    try {
      var t = localStorage.getItem('pgm-site:theme'); if (t) document.documentElement.setAttribute('data-theme', t)
      var q = new URLSearchParams(location.search).get('lang'), s = localStorage.getItem('pgm-site:lang')
      var nav = (navigator.languages || [navigator.language || 'it']).some(function (l) { return /^it\b/i.test(l) }) ? 'it' : 'en'
      var l = q === 'it' || q === 'en' ? q : s === 'it' || s === 'en' ? s : nav
      document.documentElement.setAttribute('data-lang', l)
      if (l !== 'it') { document.documentElement.lang = l; document.documentElement.classList.add('i18n-pending') }
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <div class="wrap top__in">
      <a class="brand" href="index.html">
        <svg width="22" height="22" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect x="2" y="12" width="4" height="14" rx="1.5" fill="var(--p-bassa)"/><rect x="9" y="2" width="4" height="24" rx="1.5" fill="var(--p-media)"/>
          <rect x="16" y="2" width="4" height="24" rx="1.5" fill="var(--p-alta)"/><rect x="23" y="12" width="4" height="14" rx="1.5" fill="var(--p-immediata)"/>
        </svg>
        Todo Doto
      </a>
      <nav class="nav" aria-label="Sezioni" data-i18n-aria-label="nav.label">
        <a href="index.html#funzionalita" data-i18n="nav.features">Funzionalità</a>
        <a href="index.html#prezzi" data-i18n="nav.pricing">Prezzi</a>
        <a href="guida.html" data-i18n="nav.guide" data-i18n-href="link.guide">Guida</a>
        <a class="btn btn--primary btn--sm" href="index.html#download" data-i18n="nav.download">Scarica</a>
        <div class="lang" role="group" aria-label="Lingua" data-i18n-aria-label="nav.language">
          <button type="button" data-set-lang="it" lang="it" title="Italiano">IT</button>
          <button type="button" data-set-lang="en" lang="en" title="English">EN</button>
        </div>
        <button class="theme" type="button" aria-label="Cambia tema chiaro/scuro" data-i18n-aria-label="nav.theme" title="Tema (Ctrl+Shift+L)" data-i18n-title="nav.themeTitle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <main class="legal">
    <div class="wrap--narrow log">
      <h1 data-i18n="log.title">Novità per versione</h1>
      <p class="upd"><span data-i18n="log.lead">Ogni versione, cosa cambia. Per riceverle come feed:</span> <a href="https://github.com/Nisiix/Todo-Doto/releases.atom">releases.atom</a></p>
      <div data-changelog>
        <p data-i18n="log.loading">Caricamento…</p>
      </div>
    </div>
  </main>
  <footer>
    <div class="wrap foot">
      <span>© 2026 Todo Doto</span>
      <nav class="foot__links" aria-label="Note legali" data-i18n-aria-label="foot.label">
        <a href="termini.html" data-i18n="foot.terms" data-i18n-href="link.terms">Termini di utilizzo</a>
        <a href="privacy.html" data-i18n="foot.privacy" data-i18n-href="link.privacy">Privacy</a>
        <a href="condizioni.html" data-i18n="foot.conditions" data-i18n-href="link.conditions">Condizioni di utilizzo</a>
        <a href="https://github.com/Nisiix/Todo-Doto">GitHub</a>
      </nav>
    </div>
  </footer>
  <script src="assets/i18n.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
