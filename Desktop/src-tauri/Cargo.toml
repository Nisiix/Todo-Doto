[package]
name = "project-goal-manager"
version = "0.2.15"
description = "Roadmap e todo di progetto, in locale o su cartella di rete"
authors = ["nisos"]
edition = "2021"

[lib]
name = "project_goal_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-http = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whoami = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# DPAPI: password ricordate cifrate per l'utente Windows corrente
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
